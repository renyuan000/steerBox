[package]
name = "steerbox"
version = "0.1.0"
edition = "2021"
description = "Auditable, human-steerable agent harness"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1"
libc = "0.2"
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "steerbox"
path = "src/main.rs"
